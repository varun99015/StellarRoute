name: Deploy to AWS

on:
  push:
    branches: [ "Production" ]   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest

    - name: Build & Push Frontend
      run: |
        docker build \
          --build-arg VITE_API_URL="https://stellar-route.me/api" \
          -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/stellarroute
          
          # 1. Pull the latest images built in previous steps
          docker compose pull

          # 2. Recreate containers with new code and environment variables
          # --remove-orphans ensures old manual 'docker run' containers are killed
          docker compose up -d --remove-orphans

          # 3. Prune old images to save disk space on EC2
          docker image prune -f

          # 4. Deployment Verification (Health Check)
          echo "Waiting for services to initialize..."
          sleep 15
          
          # We check the backend directly inside the container to bypass Nginx
          if docker exec backend curl --fail http://localhost:8000/health; then
            echo "✅ Deployment Successful: Backend is responding."
          else
            echo "❌ Deployment Failed: Backend health check failed."
            docker compose logs backend
            exit 1
          fi
