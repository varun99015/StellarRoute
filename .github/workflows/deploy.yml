name: Deploy to AWS

on:
  push:
    branches: [ "Production" ]   # ✅ ONLY deploy from Production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellar-backend ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellar-backend

    - name: Build & Push Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellar-frontend ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellar-frontend

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/stellar-backend
          docker pull ${{ secrets.DOCKER_USERNAME }}/stellar-frontend

          docker stop backend || true
          docker stop frontend || true

          docker rm backend || true
          docker rm frontend || true

          docker run -d -p 8000:8000 --name backend ${{ secrets.DOCKER_USERNAME }}/stellar-backend
          docker run -d -p 5173:5173 --name frontend ${{ secrets.DOCKER_USERNAME }}/stellar-frontend

          docker run -d -p 6379:6379 --name redis redis || true