name: Deploy to AWS

on:
  push:
    branches: [ "Production" ]   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest

    - name: Build & Push Frontend
      run: |
        docker build \
          --build-arg VITE_API_URL="https://stellar-route.me/api" \
          -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/stellarroute
          # Pull the latest images we just pushed to Docker Hub
          docker compose pull
          
          # Restart the services using the compose file
          # --remove-orphans cleans up any old manual 'docker run' containers
          docker compose up -d --remove-orphans

    - name: Verify Deployment Health
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sleep 10
          curl --fail http://localhost:8000/health
