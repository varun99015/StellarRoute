name: Deploy to AWS

on:
  push:
    branches: [ "Production" ]   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest

    - name: Build & Push Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest images from Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

          # Stop and remove old containers
          docker stop backend frontend || true
          docker rm backend frontend || true

          # Start new containers with correct image matching
          docker run -d -p 8000:8000 --name backend ${{ secrets.DOCKER_USERNAME }}/stellarroute-backend:latest
          docker run -d -p 5173:5173 --name frontend ${{ secrets.DOCKER_USERNAME }}/stellarroute-frontend:latest

          # Ensure Redis is running for real-time sync
          docker run -d -p 6379:6379 --name redis redis:alpine || true
