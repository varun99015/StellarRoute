name: Code Quality Checks

on:
  push:
    branches: [ "main", "Production" ]
  pull_request:
    branches: [ "main", "Production" ]

jobs:
  # JOB 1: CHECK FRONTEND (React/Vite)
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Upgraded to support Vite 7
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      # Using install because of the local package-lock sync issues we encountered
      run: npm install

    - name: Security Audit
      # Fails the build if "High" or "Critical" vulnerabilities are found
      run: npm audit --audit-level=high

    - name: Run Linter
      # npx ensures the local eslint binary is used even if not in the runner's path
      run: npx eslint .

  # JOB 2: CHECK BACKEND (Python/Navigation Logic)
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Formatter Check (Black)
      run: black --check .

    - name: Run Linter (Flake8)
      # Specifically catches logic-breaking syntax errors
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
