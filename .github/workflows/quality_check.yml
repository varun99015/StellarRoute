name: Code Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate package-lock.json
        # This will print the exact path of every package-lock.json in the repo
        run: |
          echo "Listing all package-lock.json files found:"
          find . -name "package-lock.json"
          echo "Current Path:"
          pwd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # We disable the cache temporarily to see if it's causing the pathing bug
          # cache: 'npm' 

      - name: Install Dependencies
        # We manually change directory here to be 100% sure
        run: |
          cd frontend
          npm ci
