name: Code Quality Checks

on:
  push:
    branches: [ "main", "Production" ]
  pull_request:
    branches: [ "main", "Production" ]

jobs:
  # JOB 1: CHECK FRONTEND (React/Vite)
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm install

    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Run Linter
      run: npx eslint .

    - name: Build Check
      run: npm run build

  # JOB 2: CHECK BACKEND (Python/Navigation Logic)
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      BACKEND_URL: http://localhost:8000

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest requests

    - name: Run Formatter Check
      run: black --check .

    - name: Run Linter
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Start Backend
      run: |
        nohup python run.py &
        sleep 7

    - name: Check Backend Running
      run: |
        curl --fail "$BACKEND_URL/api/space-weather/current?latitude=12.97&longitude=77.59"

    - name: Run API Tests
      run: pytest tests/